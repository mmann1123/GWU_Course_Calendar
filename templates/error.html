<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWU Course Calendar — Notice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border-radius: 16px; padding: 36px; max-width: 480px; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        }
        .icon { font-size: 44px; margin-bottom: 12px; }
        h1 { font-size: 20px; color: #202124; margin-bottom: 10px; }
        p { font-size: 14px; color: #5f6368; line-height: 1.6; margin-bottom: 24px; }
        a.btn {
            display: inline-block; padding: 11px 22px; font-size: 14px; font-weight: 600;
            color: #fff; background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            border-radius: 10px; text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>Something needs attention</h1>
        <p>{{ message }}</p>
        <a class="btn" href="/">← Back</a>
    </div>
</body>
</html>
